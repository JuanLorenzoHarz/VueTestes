services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nexus
      MYSQL_USER: nexus
      MYSQL_PASSWORD: nexus_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "127.0.0.1:${NEXUS_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: nexus
      DB_USER: nexus
      DB_PASSWORD: nexus_local
      MOCK_BUREAU_URL: http://mock-bureaus:8000
    ports:
      - "127.0.0.1:${NEXUS_API_PORT:-8080}:80"
    volumes:
      - ./api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      mock-bureaus:
        condition: service_started

  mock-bureaus:
    image: php:8.3-cli
    working_dir: /app
    command: php -S 0.0.0.0:8000 router.php
    volumes:
      - ./mock-bureaus:/app:ro

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:${NEXUS_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  tests-php:
    image: php:8.3-cli
    profiles: [tests]
    working_dir: /project
    volumes:
      - ./:/project:ro
    command: sh -c "php tests/test_bureau_contract.php && php tests/test_report_service.php"

  tests-rest:
    image: python:3.12-alpine
    profiles: [tests]
    working_dir: /project
    environment:
      NEXUS_API_URL: http://api:80
    volumes:
      - ./tests:/project/tests:ro
    depends_on:
      api:
        condition: service_started
    command: python -m unittest discover -s tests -p test_api_rest.py -v

volumes:
  mysql_data:
  frontend_node_modules:
